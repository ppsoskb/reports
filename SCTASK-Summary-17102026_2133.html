<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>vSpace SCTASK Report - 17/10/2026 21:33</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1120;
  --surface: #1e293b;
  --surface-hover: #334155;
  --border: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --purple: #c084fc;
  --amber: #fbbf24;
  --rose: #fb7185;
  --emerald: #34d399;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Prompt', sans-serif;
  background: var(--bg);
  color: var(--text-main);
  padding: 1rem;
  line-height: 1.5;
}
.container { max-width: 1250px; margin: 0 auto; }
.header {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
}
.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.header .badge {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.3);
  font-size: 0.75rem;
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
  font-weight: 600;
}
.header .time { font-size: 0.8rem; color: var(--text-muted); }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0.9rem;
  margin-bottom: 1.5rem;
}
.m-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.m-card .label { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
.m-card .val { font-size: 1.7rem; font-weight: 700; }
.m-card .hint { font-size: 0.75rem; color: var(--text-muted); }

.filters-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.filter-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.btn-group { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.btn-filter {
  background: #0f172a;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.btn-filter:hover { background: var(--surface-hover); color: #fff; }
.btn-filter.active { background: var(--accent); color: #0f172a; font-weight: 600; border-color: var(--accent); }

.reason-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.reason-card.apt { border-left: 4px solid var(--emerald); }
.reason-card.postpone { border-left: 4px solid var(--amber); }
.reason-card.project { border-left: 4px solid var(--purple); }

.reason-header {
  padding: 0.9rem 1.1rem;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.reason-name { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 0.4rem; }
.reason-count { font-size: 0.8rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 6px; }
.badge-apt { background: rgba(52, 211, 153, 0.2); color: var(--emerald); }
.badge-postpone { background: rgba(251, 191, 36, 0.2); color: var(--amber); }
.badge-project { background: rgba(192, 132, 252, 0.2); color: var(--purple); }

.ticket-list { display: flex; flex-direction: column; }
.ticket-row {
  padding: 0.9rem 1.1rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  transition: background 0.15s ease;
}
.ticket-row:hover { background: rgba(255,255,255,0.02); }
.ticket-row:last-child { border-bottom: none; }
.ticket-row.hidden { display: none !important; }

.row-main {
  display: grid;
  grid-template-columns: 210px 1.3fr 1.1fr 170px auto;
  gap: 0.8rem;
  align-items: center;
}
.t-inc { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600; color: var(--accent); }
.t-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }
.t-days { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 600; display: inline-block; }
.days-green { background: rgba(52, 211, 153, 0.15); color: var(--emerald); }
.days-yellow { background: rgba(251, 191, 36, 0.15); color: var(--amber); }
.days-red { background: rgba(251, 113, 133, 0.15); color: var(--rose); }

.st-badge {
  display: inline-block;
  font-size: 0.75rem;
  padding: 0.1rem 0.45rem;
  border-radius: 4px;
  font-weight: 600;
  margin-left: 0.25rem;
}
.st-pending { background: rgba(251, 191, 36, 0.2); color: var(--amber); }
.st-inprogress { background: rgba(56, 189, 248, 0.2); color: var(--accent); }

.t-cat { font-size: 0.85rem; font-weight: 500; color: #fff; }
.t-device { font-size: 0.75rem; color: var(--text-muted); }

.t-branch { font-size: 0.85rem; color: #e2e8f0; }
.branch-file { color: var(--purple); font-weight: 600; }
.t-center { font-size: 0.8rem; color: #38bdf8; font-weight: 500; }

.toggle-icon {
  font-size: 0.8rem;
  color: var(--text-muted);
  transition: transform 0.2s ease;
  user-select: none;
}
.ticket-row.open .toggle-icon { transform: rotate(180deg); color: var(--accent); }

.summary-box {
  display: none;
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: #0f172a;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  color: #e2e8f0;
  line-height: 1.6;
  animation: fadeIn 0.2s ease;
}
.ticket-row.open .summary-box { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 850px) {
  .row-main { grid-template-columns: 1fr; gap: 0.4rem; }
  .toggle-icon { display: flex; justify-content: flex-end; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-row">
      <h1>📋 vSpace SCTASK Dashboard</h1>
      <span class="badge">SRM • AI Summary</span>
    </div>
    <div class="time">อัปเดตล่าสุด: 17/10/2026 21:33 น. | ข้อมูลจาก vSpace API</div>
  </div>

  <div class="metrics-grid">
    <div class="m-card">
      <div class="label">SCTASK ทั้งหมด <span>📦</span></div>
      <div class="val" style="color:#38bdf8">0</div>
      <div class="hint">Active Request ทั้งหมดในระบบ</div>
    </div>

  </div>

  <div class="filters-wrap">
    <div>
      <div class="filter-title">⚡ เลือกเฉพาะ Pending Reason ที่ต้องการดู</div>
      <div class="btn-group" id="reason-filter-btns">
        <button class="btn-filter active" data-r="all">ทั้งหมด (0)</button>

      </div>
    </div>
  </div>

  <div class="reason-container">

  </div>
</div>

<script>
let activeR = 'all';

function filterReasons() {
  document.querySelectorAll('.reason-card').forEach(card => {
    const cardReason = card.dataset.reason;
    const isMatch = activeR === 'all' || cardReason === activeR;
    card.style.display = isMatch ? '' : 'none';
  });
}

document.querySelectorAll('#reason-filter-btns .btn-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#reason-filter-btns .btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeR = btn.dataset.r;
    filterReasons();
  });
});
</script>
</body>
</html>
